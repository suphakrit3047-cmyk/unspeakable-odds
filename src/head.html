<title>Unspeakable Odds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Pixelify+Sans:wght@500;700&family=Sarabun:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column like a ritual table — stats on top, the horror in the middle, your dice at hand below */
:root{
  color-scheme:dark;
  --bg:#0e1418; --panel:#162027; --panel2:#1c2830; --line:#2c3a42;
  --fg:#e7e0cd; --dim:#8b948f;
  --blood:#cf5a46; --steel:#a4b8c2; --rose:#dc8296; --bronze:#d0a052;
  --verd:#62b49a; --ash:#aaa2c0; --void:#a77ae0;
  --display:'Pridi', 'Noto Serif Thai', Georgia, serif;
  --body:'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px 32px;}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:700}
h1{font-size:2.1rem;line-height:1.15;letter-spacing:.01em}
h2{font-size:1.35rem}
p{margin:0}
.dim{color:var(--dim)}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--bronze);outline-offset:2px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-weight:700;font-size:1rem}
.btn.primary{background:var(--bronze);color:#1a1408;border-color:var(--bronze)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 140px}

/* icons */
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nil{font-size:1.2rem;color:var(--dim)}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.bar .lbl{display:flex;justify-content:space-between;font-size:.82rem;color:var(--dim)}
.bar .lbl b{color:var(--fg);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:5px}
.fill{height:100%;border-radius:4px;transition:width .35s}
.hp .fill{background:var(--blood)}
.sn .fill{background:var(--bronze)}
.sn.low .fill{background:var(--void)}

/* path */
.path{display:flex;align-items:center;gap:0}
.node{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:.75rem;color:var(--dim);flex:none;font-variant-numeric:tabular-nums;background:var(--panel)}
.node.done{background:var(--verd);color:#0b1512;border-color:var(--verd)}
.node.now{border-color:var(--bronze);color:var(--bronze);box-shadow:0 0 0 3px rgba(208,160,82,.18)}
.node.boss{border-radius:6px}
.link{flex:1;height:1px;background:var(--line)}

/* enemy */
.enemy{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.enemy .sig{width:96px;height:96px}
.enemy .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;display:inline-flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums}
.chip .ic{width:14px;height:14px}
.intent{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-size:.88rem}
.intent .part{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.intent .ic{width:18px;height:18px}
.enemy.hit{animation:hit .35s}
@keyframes hit{25%{transform:translateX(-6px)}60%{transform:translateX(5px)}}

/* dice */
.warn{border:1px solid var(--void);color:var(--void);border-radius:10px;padding:8px 12px;font-size:.88rem}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.die{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-width:0}
.die .tint{position:absolute;inset:0 0 auto;height:3px;border-radius:12px 12px 0 0;background:var(--tint)}
.die .nm{font-size:.72rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.die.held{border-color:var(--bronze);background:var(--panel2)}
.die .lock{position:absolute;top:6px;right:6px;font-size:.62rem;color:var(--bronze);letter-spacing:.06em}
.die .dmark{position:absolute;top:6px;left:6px;font-size:.62rem;color:var(--void)}
.face{width:58px;height:58px;border-radius:10px;border:2px solid var(--fc);color:var(--fc);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--bg)}
.face b{font-size:1rem;line-height:1;font-variant-numeric:tabular-nums}
.face.dist{box-shadow:0 0 12px var(--void)}
.face.sm{width:38px;height:38px;border-width:1.5px;border-radius:7px}
.face.sm .ic{width:15px;height:15px}
.face.sm b{font-size:.75rem}
.rolling .face{animation:roll .35s}
@keyframes roll{0%{transform:rotate(-20deg) scale(.85)}60%{transform:rotate(8deg) scale(1.05)}100%{transform:none}}
.preview{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;justify-items:center}

.log{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:2px;min-height:5.2em}
.log p:first-child{color:var(--fg)}
.log p{color:var(--dim)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.1rem;display:flex;align-items:center;gap:8px}
.card h3 .sw{width:10px;height:10px;border-radius:2px;background:var(--tint);flex:none}
.tier{font-family:var(--body);font-size:.72rem;color:var(--dim);font-weight:500;margin-left:auto}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.88rem}
ol.how{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.big{font-size:3rem;font-family:var(--display);text-align:center}

.top{display:flex;gap:12px;align-items:center}
.top .path{flex:1;min-width:0}
.help{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--bronze);background:var(--panel);color:var(--bronze);font-family:var(--display);font-weight:700;font-size:1.1rem;display:grid;place-items:center}
.forecast{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.88rem;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.forecast .part{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-variant-numeric:tabular-nums}
.forecast .part .ic{width:16px;height:16px}
.forecast .cb{font-size:.68rem;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}
.forecast .threat{flex-basis:100%;color:var(--dim);font-size:.82rem}
.die.combo .face{box-shadow:0 0 0 3px var(--panel),0 0 0 4px var(--fc)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,10,.72);display:flex;align-items:flex-end;justify-content:center;
  padding:env(safe-area-inset-top,0px) max(0px, env(safe-area-inset-right,0px)) 0 max(0px, env(safe-area-inset-left,0px))}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:88%;overflow-y:auto;
  padding:16px max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-16px;background:var(--bg);padding-block:8px}
.sh{font-size:1rem;color:var(--bronze);margin-top:6px}
.glossary{display:flex;flex-direction:column;gap:8px}
.glossary div{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;font-size:.9rem}
.glossary b{display:block}
body.insane .tray{animation:wob 4s ease-in-out infinite}
body.insane::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(167,122,224,.28)}
@keyframes wob{50%{transform:skewX(-1.2deg) translateY(1px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.face{width:50px;height:50px}.enemy{grid-template-columns:72px 1fr}.enemy .sig{width:72px;height:72px}}
